name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          # نحتفظ بملفاتنا لأن flutter create قد يستبدلها
          mkdir /tmp/bak
          cp pubspec.yaml /tmp/bak/
          cp -r lib /tmp/bak/lib
          cp android/app/src/main/AndroidManifest.xml /tmp/bak/

          flutter create --org com.printeasy --project-name printeasy --platforms android .

          # نعيد ملفاتنا
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/bak/lib lib
          cp /tmp/bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf test

          # minSdk = 21 (يدعم صيغتي Groovy و Kotlin)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle* || true
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintEasy-APK
          path: build/app/outputs/flutter-apk/app-release.apk
